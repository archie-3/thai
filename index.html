<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>🥭 Thai Life with Mango</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:#0f0f14}
  body{background:#0f0f14;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;color:#f0ece4;overflow-y:auto;overflow-x:hidden}
  #app{min-height:600px;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;background:#0f0f14}
  .screen{flex:1;display:flex;flex-direction:column}
  ::-webkit-scrollbar{width:0;display:none}
  button{cursor:pointer;border:none;outline:none;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Rounded','Helvetica Neue',Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;color:inherit}
  #flipCard{color:#ffffff!important}
  #flipCard *{color:inherit}
  #flipCard .en-text{color:#ffffff!important;font-size:24px;font-weight:900;text-align:center;line-height:1.4;text-shadow:0 2px 8px rgba(0,0,0,1)}
  #flipCard .th-text{color:var(--unit-color,#FF6B35)!important;font-size:30px;font-weight:900;text-align:center;line-height:1.3}
  #flipCard .rom-text{color:#aaaacc!important;font-size:15px;font-style:italic}
  #flipCard .tip-text{color:#ddddee!important;font-size:12.5px;text-align:center;line-height:1.6;background:rgba(255,255,255,0.12);border-radius:12px;padding:10px 14px;margin-top:8px;border:1px solid rgba(255,255,255,0.2)}
  #flipCard .label-text{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes idle{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}50%{transform:translateY(-10px) rotate(2deg) scale(1.03)}}
  @keyframes celebrate{0%,100%{transform:translateY(0) rotate(0) scale(1)}20%{transform:translateY(-22px) rotate(-14deg) scale(1.2)}60%{transform:translateY(-14px) rotate(14deg) scale(1.15)}}
  @keyframes scared{0%,100%{transform:translateX(0) scale(1)}25%{transform:translateX(-6px) scale(0.95)}75%{transform:translateX(6px) scale(0.95)}}
  @keyframes cry{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(4px) scale(0.92)}70%{transform:translateY(2px) scale(0.96)}}
  @keyframes sleepy{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(0.97)}}
  @keyframes coinFall{0%{transform:translateY(-80px) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translateY(105vh) rotate(740deg);opacity:0}}
  @keyframes coinPopOut{0%{transform:scale(0) rotate(0deg);opacity:0}40%{transform:scale(1.5) rotate(200deg);opacity:1}100%{transform:scale(0.8) rotate(360deg) translateY(60px);opacity:0}}
  @keyframes unlockPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #FFE66D60}50%{transform:scale(1.06);box-shadow:0 0 0 12px #FFE66D00}}
  @keyframes genderGlow{0%,100%{opacity:1}50%{opacity:0.7}}
  .pop{animation:pop .3s ease}
  .shake{animation:shake .4s ease}
  .su{animation:slideUp .32s ease forwards;opacity:0}
  .fade{animation:fadeIn .25s ease forwards}
  .btn-press:active{transform:scale(0.96)!important}
  .n-idle{animation:idle 2.4s ease-in-out infinite;display:inline-block}
  .n-celebrate{animation:celebrate .5s ease-in-out infinite;display:inline-block}
  .n-scared{animation:scared .35s ease-in-out infinite;display:inline-block}
  .n-cry{animation:cry .7s ease-in-out infinite;display:inline-block}
  .n-sleepy{animation:sleepy 3s ease-in-out infinite;display:inline-block}
  .coin{position:absolute;animation:coinFall linear forwards}
  .coin-pop{position:absolute;animation:coinPopOut ease-out forwards}
  .unlock-badge{animation:unlockPulse 1.2s ease-in-out 3}
  .gender-toggle{display:flex;align-items:center;background:#1c1c28;border-radius:30px;padding:4px;border:1px solid #ffffff20;position:relative;gap:2px}
  .gender-btn{padding:7px 16px;border-radius:24px;font-size:13px;font-weight:800;transition:all .25s;position:relative;z-index:1}
  .gender-btn.active-f{background:linear-gradient(135deg,#FF8FAB,#ff6b9d);color:#fff;box-shadow:0 2px 10px #FF8FAB50}
  .gender-btn.active-m{background:linear-gradient(135deg,#4fc3f7,#0288d1);color:#fff;box-shadow:0 2px 10px #4fc3f750}
  .gender-btn.inactive{background:transparent;color:#ffffff50}
</style>
</head>
<body>
<div id="app"></div>
<script>

// ═══════════════════════════════════════
//  GENDER SYSTEM
// ═══════════════════════════════════════
// G = 'f' (female) or 'm' (male)
// Each card has f:{th,rom,audio} and m:{th,rom,audio} plus shared en + tip

function getG(){ try{return localStorage.getItem('thai_gender')||'f';}catch{return 'f';} }
function setG(g){ try{localStorage.setItem('thai_gender',g);}catch{} }

// Gender-specific language constants
const LANG = {
  f:{ particle:'ka', particleTh:'ค่ะ', particleQ:'kha', particleQTh:'คะ', I:'Chan', ITh:'ฉัน', pronoun:'she', emoji:'🌸', color:'#FF8FAB', label:'Female 🌸', resultMsg:'ka! 🌸', proudMsg:'MANGO IS SO PROUD! 🌸', believeMsg:'MANGO BELIEVES IN YOU! 💪', voice:{pitch:1.1,rate:0.82} },
  m:{ particle:'krap', particleTh:'ครับ', particleQ:'krap', particleQTh:'ครับ', I:'Phom', ITh:'ผม', pronoun:'he', emoji:'💪', color:'#4fc3f7', label:'Male 💪', resultMsg:'krap! 💪', proudMsg:'MANGO IS SO PROUD! 🙌', believeMsg:'MANGO BELIEVES IN YOU! 💪', voice:{pitch:0.75,rate:0.80} },
};

// ═══════════════════════════════════════
//  MANGO WARDROBE
// ═══════════════════════════════════════
const OUTFITS = [
  { xp:0,    id:'default', label:'Baby Mango',       hat:'',   acc:'',   badge:'' },
  { xp:50,   id:'flower',  label:'Blossom 🌸',       hat:'🌸', acc:'',   badge:'' },
  { xp:150,  id:'student', label:'Student 📚',       hat:'🎓', acc:'📚', badge:'' },
  { xp:300,  id:'chef',    label:'Thai Chef 🍜',     hat:'👨‍🍳', acc:'🍜', badge:'' },
  { xp:500,  id:'tourist', label:'Explorer 🗺️',     hat:'🧢', acc:'🗺️', badge:'' },
  { xp:750,  id:'dancer',  label:'Thai Dancer 💃',   hat:'👑', acc:'💃', badge:'✨' },
  { xp:1000, id:'queen',   label:'Thai Queen 👸',    hat:'👸', acc:'💎', badge:'🌟' },
  { xp:1500, id:'master',  label:'Thai Master 🏆',   hat:'🎖️', acc:'🏆', badge:'🌈' },
];
function getCurrentOutfit(xp){ let o=OUTFITS[0]; for(const x of OUTFITS){if(xp>=x.xp)o=x;else break;} return o; }
function getNextOutfit(xp){ return OUTFITS.find(o=>o.xp>xp)||null; }

function mangoHTML(mood,xp,size=52,gender='f'){
  const outfit=getCurrentOutfit(xp);
  const animClass={idle:'n-idle',celebrate:'n-celebrate',scared:'n-scared',cry:'n-cry',sleepy:'n-sleepy',thinking:'n-idle'}[mood]||'n-idle';
  const face=mood==='cry'?'😢':mood==='scared'?'😨':mood==='celebrate'?'🥳':mood==='sleepy'?'😴':'🐘';
  const tint=gender==='m'?'filter:hue-rotate(200deg)':'';
  return `<div class="${animClass}" style="display:inline-flex;flex-direction:column;align-items:center;gap:0;line-height:1;position:relative;${tint}">
    ${outfit.hat?`<div style="font-size:${Math.round(size*.55)}px;margin-bottom:-4px;z-index:2">${outfit.hat}</div>`:''}
    <div style="font-size:${size}px;position:relative">${face}${outfit.badge?`<div style="position:absolute;bottom:-4px;right:-6px;font-size:${Math.round(size*.35)}px">${outfit.badge}</div>`:''}</div>
    ${outfit.acc?`<div style="font-size:${Math.round(size*.45)}px;margin-top:-2px">${outfit.acc}</div>`:''}
  </div>`;
}

// ═══════════════════════════════════════
//  DATA  — each card has f + m versions
//  f: female Thai (ค่ะ/ฉัน)
//  m: male Thai   (ครับ/ผม)
//  en + tip shared
// ═══════════════════════════════════════
const UNITS = [
 {

    {f:{th:"Khob khun mak mak ka",rom:"ขอบคุณมากมากค่ะ",audio:"ขอบคุณมากมากค่ะ"},m:{th:"Khob khun mak mak krap",rom:"ขอบคุณมากมากครับ",audio:"ขอบคุณมากมากครับ"},en:"Thank you so very much",tip:"Doubling 'mak' (a lot) makes it even more heartfelt"},

    {f:{th:"Sanuk mak ka!",rom:"สนุกมากค่ะ",audio:"สนุกมากค่ะ"},m:{th:"Sanuk mak krap!",rom:"สนุกมากครับ",audio:"สนุกมากครับ"},en:"It's so fun!",tip:"'Sanuk' = fun. A core Thai life value!"},
   ]},
  ]
 },
 {

    {f:{th:"Tao rai kha?",rom:"เท่าไหร่คะ",audio:"เท่าไหร่คะ"},m:{th:"Tao rai krap?",rom:"เท่าไหร่ครับ",audio:"เท่าไหร่ครับ"},en:"How much?",tip:"Your polite particle makes this sound friendly, not demanding!"},
    {f:{th:"Paeng mak loei ka",rom:"แพงมากเลยค่ะ",audio:"แพงมากเลยค่ะ"},m:{th:"Paeng mak loei krap",rom:"แพงมากเลยครับ",audio:"แพงมากเลยครับ"},en:"That's very expensive!",tip:"Say with a smile — Thais enjoy playful bargaining"},
    {f:{th:"Lot noi dai mai kha?",rom:"ลดหน่อยได้ไหมคะ",audio:"ลดหน่อยได้ไหมคะ"},m:{th:"Lot noi dai mai krap?",rom:"ลดหน่อยได้ไหมครับ",audio:"ลดหน่อยได้ไหมครับ"},en:"Can you lower the price a bit?",tip:"Polite bargaining works far better than demanding"},
    {f:{th:"Nee rakha dee tee sut laew rue kha?",rom:"นี่ราคาดีที่สุดแล้วหรือคะ",audio:"นี่ราคาดีที่สุดแล้วหรือคะ"},m:{th:"Nee rakha dee tee sut laew rue krap?",rom:"นี่ราคาดีที่สุดแล้วหรือครับ",audio:"นี่ราคาดีที่สุดแล้วหรือครับ"},en:"Is this the best price?",tip:"A classic bargaining opener — say with a smile!"},
    {f:{th:"Ao nee ka",rom:"เอานี่ค่ะ",audio:"เอานี่ค่ะ"},m:{th:"Ao nee krap",rom:"เอานี่ครับ",audio:"เอานี่ครับ"},en:"I'll take this one",tip:"Point at the item — natural and clear in markets"},
    {f:{th:"Mai ao ka, khob khun",rom:"ไม่เอาค่ะ ขอบคุณ",audio:"ไม่เอาค่ะ ขอบคุณ"},m:{th:"Mai ao krap, khob khun",rom:"ไม่เอาครับ ขอบคุณ",audio:"ไม่เอาครับ ขอบคุณ"},en:"No thank you",tip:"Always add 'khob khun' — stays polite when declining"},
    {f:{th:"Mee thorn mai kha?",rom:"มีทอนไหมคะ",audio:"มีทอนไหมคะ"},m:{th:"Mee thorn mai krap?",rom:"มีทอนไหมครับ",audio:"มีทอนไหมครับ"},en:"Do you have change?",tip:"'Thorn' = change/change back. Very useful at markets!"},
   ]},
  ]
 },
 {
  id:"food",title:"Food & Eating",emoji:"🍜",color:"#FFE66D",
  lessons:[
   { id:"f1",title:"At the Restaurant",cards:[
    {f:{th:"Aroi mak ka!",rom:"อร่อยมากค่ะ",audio:"อร่อยมากค่ะ"},m:{th:"Aroi mak krap!",rom:"อร่อยมากครับ",audio:"อร่อยมากครับ"},en:"It's delicious!",tip:"Thais beam when you say this — use it freely!"},
    {f:{th:"Phet noi noi na ka",rom:"เผ็ดน้อยน้อยนะคะ",audio:"เผ็ดน้อยน้อยนะคะ"},m:{th:"Phet noi noi na krap",rom:"เผ็ดน้อยน้อยนะครับ",audio:"เผ็ดน้อยน้อยนะครับ"},en:"Just a tiny bit spicy please",tip:"Even 'noi noi' (little little) can still be very spicy!"},
    {f:{th:"Mai sai phet ka",rom:"ไม่ใส่เผ็ดค่ะ",audio:"ไม่ใส่เผ็ดค่ะ"},m:{th:"Mai sai phet krap",rom:"ไม่ใส่เผ็ดครับ",audio:"ไม่ใส่เผ็ดครับ"},en:"No chilli at all please",tip:"'Mai sai' = don't put in. More direct than 'mai ao phet'"},
    {f:{th:"Chan gin jay ka",rom:"ฉันกินเจค่ะ",audio:"ฉันกินเจค่ะ"},m:{th:"Phom gin jay krap",rom:"ผมกินเจครับ",audio:"ผมกินเจครับ"},en:"I'm vegetarian",tip:"Look for the yellow 'เจ' flag sign for vegan-friendly food"},
    {f:{th:"Khor nam plao ka",rom:"ขอน้ำเปล่าค่ะ",audio:"ขอน้ำเปล่าค่ะ"},m:{th:"Khor nam plao krap",rom:"ขอน้ำเปล่าครับ",audio:"ขอน้ำเปล่าครับ"},en:"May I have plain water please",tip:"Khor = may I have — the polite request word"},
    {f:{th:"Khor check bin ka",rom:"ขอเช็คบิลค่ะ",audio:"ขอเช็คบิลค่ะ"},m:{th:"Khor check bin krap",rom:"ขอเช็คบิลครับ",audio:"ขอเช็คบิลครับ"},en:"The bill please",tip:"Or do the universal 'writing in the air' gesture!"},
    {f:{th:"Im laew ka, khob khun",rom:"อิ่มแล้วค่ะ ขอบคุณ",audio:"อิ่มแล้วค่ะ ขอบคุณ"},m:{th:"Im laew krap, khob khun",rom:"อิ่มแล้วครับ ขอบคุณ",audio:"อิ่มแล้วครับ ขอบคุณ"},en:"I'm full, thank you",tip:"Thais often ask if you've eaten — now you can answer!"},
   ]},
   { id:"f2",title:"Popular Thai Dishes",cards:[
    {f:{th:"Pad Thai",rom:"ผัดไทย",audio:"ผัดไทย"},m:{th:"Pad Thai",rom:"ผัดไทย",audio:"ผัดไทย"},en:"Stir-fried rice noodles",tip:"Thailand's most famous dish! Ask 'mai sai phet' if needed"},
    {f:{th:"Tom Yum Goong",rom:"ต้มยำกุ้ง",audio:"ต้มยำกุ้ง"},m:{th:"Tom Yum Goong",rom:"ต้มยำกุ้ง",audio:"ต้มยำกุ้ง"},en:"Spicy prawn soup",tip:"Tom=boil, Yum=spicy mix, Goong=prawn. A national favourite"},
    {f:{th:"Som Tam",rom:"ส้มตำ",audio:"ส้มตำ"},m:{th:"Som Tam",rom:"ส้มตำ",audio:"ส้มตำ"},en:"Green papaya salad",tip:"Order 'som tam farang' for a milder, less spicy version!"},
    {f:{th:"Khao pad gai",rom:"ข้าวผัดไก่",audio:"ข้าวผัดไก่"},m:{th:"Khao pad gai",rom:"ข้าวผัดไก่",audio:"ข้าวผัดไก่"},en:"Chicken fried rice",tip:"Khao=rice, Pad=fried, Gai=chicken. Mix and match proteins!"},
    {f:{th:"Gaeng khiao wan",rom:"แกงเขียวหวาน",audio:"แกงเขียวหวาน"},m:{th:"Gaeng khiao wan",rom:"แกงเขียวหวาน",audio:"แกงเขียวหวาน"},en:"Green curry",tip:"Literally 'sweet green curry' — coconut-based and aromatic"},
    {f:{th:"Khao niao mamuang",rom:"ข้าวเหนียวมะม่วง",audio:"ข้าวเหนียวมะม่วง"},m:{th:"Khao niao mamuang",rom:"ข้าวเหนียวมะม่วง",audio:"ข้าวเหนียวมะม่วง"},en:"Mango sticky rice",tip:"The ultimate Thai dessert! Best in mango season (March–May)"},
    {f:{th:"Gaeng daeng",rom:"แกงแดง",audio:"แกงแดง"},m:{th:"Gaeng daeng",rom:"แกงแดง",audio:"แกงแดง"},en:"Red curry",tip:"Daeng = red. Richer and spicier than green curry — coconut-based"},
    {f:{th:"Massaman",rom:"มัสหมั่น",audio:"มัสหมั่น"},m:{th:"Massaman",rom:"มัสหมั่น",audio:"มัสหมั่น"},en:"Massaman curry",tip:"Mild, rich and slightly sweet — great for those who can't take heat!"},
    {f:{th:"Laab",rom:"ลาบ",audio:"ลาบ"},m:{th:"Laab",rom:"ลาบ",audio:"ลาบ"},en:"Spicy minced meat salad",tip:"A northern Thai favourite — often very spicy with fresh herbs"},
    {f:{th:"Gai Yang",rom:"ไก่ย่าง",audio:"ไก่ย่าง"},m:{th:"Gai Yang",rom:"ไก่ย่าง",audio:"ไก่ย่าง"},en:"Grilled chicken",tip:"Gai=chicken, Yang=grilled. Perfect street food with sticky rice!"},
   ]},
   { id:"f4",title:"Noodles & Rice",cards:[
    {f:{th:"Guay tiao",rom:"กวยเตี๋ยว",audio:"กวยเตี๋ยว"},m:{th:"Guay tiao",rom:"กวยเตี๋ยว",audio:"กวยเตี๋ยว"},en:"Noodle soup",tip:"The word for noodles in Thai. Order at any noodle shop — cheap and delicious!"},
    {f:{th:"Guay tiao nam",rom:"กวยเตี๋ยวน้ำ",audio:"กวยเตี๋ยวน้ำ"},m:{th:"Guay tiao nam",rom:"กวยเตี๋ยวน้ำ",audio:"กวยเตี๋ยวน้ำ"},en:"Noodle soup (with broth)",tip:"Nam = water/broth. The classic wet noodle soup style"},
    {f:{th:"Guay tiao haeng",rom:"กวยเตี๋ยวแห้ง",audio:"กวยเตี๋ยวแห้ง"},m:{th:"Guay tiao haeng",rom:"กวยเตี๋ยวแห้ง",audio:"กวยเตี๋ยวแห้ง"},en:"Dry noodles (no broth)",tip:"Haeng = dry. Same noodles but tossed in sauce instead of soup"},
    {f:{th:"Sen lek",rom:"เส้นเล็ก",audio:"เส้นเล็ก"},m:{th:"Sen lek",rom:"เส้นเล็ก",audio:"เส้นเล็ก"},en:"Thin rice noodles",tip:"Sen=noodle, Lek=small/thin. The most common noodle in Thai soups"},
    {f:{th:"Sen yai",rom:"เส้นใหญ่",audio:"เส้นใหญ่"},m:{th:"Sen yai",rom:"เส้นใหญ่",audio:"เส้นใหญ่"},en:"Wide flat rice noodles",tip:"Sen=noodle, Yai=big/wide. Thick flat noodles, great in stir-fries"},
    {f:{th:"Ba mee",rom:"บะหมี่",audio:"บะหมี่"},m:{th:"Ba mee",rom:"บะหมี่",audio:"บะหมี่"},en:"Egg noodles",tip:"Yellow wheat noodles — often served with BBQ pork (moo daeng)"},
    {f:{th:"Woon sen",rom:"วุ้นเส้น",audio:"วุ้นเส้น"},m:{th:"Woon sen",rom:"วุ้นเส้น",audio:"วุ้นเส้น"},en:"Glass noodles",tip:"Clear, thin vermicelli noodles — used in glass noodle salad (yum woon sen)"},
    {f:{th:"Khao suay",rom:"ข้าวสวย",audio:"ข้าวสวย"},m:{th:"Khao suay",rom:"ข้าวสวย",audio:"ข้าวสวย"},en:"Steamed jasmine rice",tip:"Khao=rice, Suay=beautiful. Plain steamed rice served with everything!"},
    {f:{th:"Khao niao",rom:"ข้าวเหนียว",audio:"ข้าวเหนียว"},m:{th:"Khao niao",rom:"ข้าวเหนียว",audio:"ข้าวเหนียว"},en:"Sticky rice",tip:"Essential in northern and northeastern Thailand — eat it with your hands!"},
    {f:{th:"Khao tom",rom:"ข้าวต้ม",audio:"ข้าวต้ม"},m:{th:"Khao tom",rom:"ข้าวต้ม",audio:"ข้าวต้ม"},en:"Rice porridge / congee",tip:"Tom=boil. A popular Thai breakfast or late-night comfort food"},
    {f:{th:"Khor khao neung ja ka",rom:"ขอข้าวหนึ่งจะค่ะ",audio:"ขอข้าวหนึ่งจะค่ะ"},m:{th:"Khor khao neung ja krap",rom:"ขอข้าวหนึ่งจะครับ",audio:"ขอข้าวหนึ่งจะครับ"},en:"One portion of rice please",tip:"Neung = one, Ja = portion. Say this when ordering rice at a restaurant!"},
   ]},
   { id:"f3",title:"Drinks & Ordering",cards:[
    {f:{th:"Khor cha yen ka",rom:"ขอชาเย็นค่ะ",audio:"ขอชาเย็นค่ะ"},m:{th:"Khor cha yen krap",rom:"ขอชาเย็นครับ",audio:"ขอชาเย็นครับ"},en:"Thai iced tea please",tip:"The classic sweet orange drink — ask 'wan noi' for less sugar"},
    {f:{th:"Wan noi ka",rom:"หวานน้อยค่ะ",audio:"หวานน้อยค่ะ"},m:{th:"Wan noi krap",rom:"หวานน้อยครับ",audio:"หวานน้อยครับ"},en:"Less sweet please",tip:"Essential for any Thai drink order — saves you from sugar overload!"},
    {f:{th:"Nam manao yen ka",rom:"น้ำมะนาวเย็นค่ะ",audio:"น้ำมะนาวเย็นค่ะ"},m:{th:"Nam manao yen krap",rom:"น้ำมะนาวเย็นครับ",audio:"น้ำมะนาวเย็นครับ"},en:"Cold fresh lime juice",tip:"Refreshing, cheap and everywhere — 'yen' means cold/iced"},
    {f:{th:"Mai sai nam tan ka",rom:"ไม่ใส่น้ำตาลค่ะ",audio:"ไม่ใส่น้ำตาลค่ะ"},m:{th:"Mai sai nam tan krap",rom:"ไม่ใส่น้ำตาลครับ",audio:"ไม่ใส่น้ำตาลครับ"},en:"No sugar please",tip:"Thai drinks are very sweet by default — this is a lifesaver!"},
    {f:{th:"Kafae yen ka",rom:"กาแฟเย็นค่ะ",audio:"กาแฟเย็นค่ะ"},m:{th:"Kafae yen krap",rom:"กาแฟเย็นครับ",audio:"กาแฟเย็นครับ"},en:"Iced coffee please",tip:"Kafae = coffee (borrowed from Portuguese!)"},
    {f:{th:"Sai nam khaeng duay na ka",rom:"ใส่น้ำแข็งด้วยนะคะ",audio:"ใส่น้ำแข็งด้วยนะคะ"},m:{th:"Sai nam khaeng duay na krap",rom:"ใส่น้ำแข็งด้วยนะครับ",audio:"ใส่น้ำแข็งด้วยนะครับ"},en:"With ice please",tip:"'Duay' = also/as well. The polite particle makes it a gentle request"},
    {f:{th:"Khor cha rorn ka",rom:"ขอชาร้อนค่ะ",audio:"ขอชาร้อนค่ะ"},m:{th:"Khor cha rorn krap",rom:"ขอชาร้อนครับ",audio:"ขอชาร้อนครับ"},en:"Hot tea please",tip:"Rorn = hot. Simple and useful — Thai green tea is served hot in many restaurants for free!"},
    {f:{th:"Khor cha khiao rorn ka",rom:"ขอชาเขียวร้อนค่ะ",audio:"ขอชาเขียวร้อนค่ะ"},m:{th:"Khor cha khiao rorn krap",rom:"ขอชาเขียวร้อนครับ",audio:"ขอชาเขียวร้อนครับ"},en:"Hot green tea please",tip:"Khiao = green. Many Thai restaurants give free hot green tea — just ask!"},
    {f:{th:"Khor kafae rorn ka",rom:"ขอกาแฟร้อนค่ะ",audio:"ขอกาแฟร้อนค่ะ"},m:{th:"Khor kafae rorn krap",rom:"ขอกาแฟร้อนครับ",audio:"ขอกาแฟร้อนครับ"},en:"Hot coffee please",tip:"Just swap 'yen' (cold) for 'rorn' (hot) on any drink to get it hot!"},
    {f:{th:"Khor kafae dam rorn ka",rom:"ขอกาแฟดำร้อนค่ะ",audio:"ขอกาแฟดำร้อนค่ะ"},m:{th:"Khor kafae dam rorn krap",rom:"ขอกาแฟดำร้อนครับ",audio:"ขอกาแฟดำร้อนครับ"},en:"Hot black coffee please",tip:"Dam = black. No milk, no sugar — very strong Thai black coffee!"},
    {f:{th:"Milo rorn ka",rom:"ไมโลร้อนค่ะ",audio:"ไมโลร้อนค่ะ"},m:{th:"Milo rorn krap",rom:"ไมโลร้อนครับ",audio:"ไมโลร้อนครับ"},en:"Hot Milo (chocolate malt drink)",tip:"Milo is hugely popular in Thailand — a sweet chocolate malt drink, hot or cold"},
    {f:{th:"Mai sai nom ka",rom:"ไม่ใส่นมค่ะ",audio:"ไม่ใส่นมค่ะ"},m:{th:"Mai sai nom krap",rom:"ไม่ใส่นมครับ",audio:"ไม่ใส่นมครับ"},en:"No milk please",tip:"Nom = milk. Useful if you're lactose intolerant or just prefer black!"},
   ]},
  ]
 },
 {
  id:"transport",title:"Getting Around",emoji:"🛺",color:"#A8E6CF",
  lessons:[
   { id:"t1",title:"Transport & Taxis",cards:[
    {f:{th:"Pai [place] tao rai kha?",rom:"ไป...เท่าไหร่คะ",audio:"ไปเท่าไหร่คะ"},m:{th:"Pai [place] tao rai krap?",rom:"ไป...เท่าไหร่ครับ",audio:"ไปเท่าไหร่ครับ"},en:"How much to go to...?",tip:"Always negotiate BEFORE getting in a tuk-tuk or songthaew!"},
    {f:{th:"Chuat meter dai mai kha?",rom:"ใช้มิเตอร์ได้ไหมคะ",audio:"ใช้มิเตอร์ได้ไหมคะ"},m:{th:"Chuat meter dai mai krap?",rom:"ใช้มิเตอร์ได้ไหมครับ",audio:"ใช้มิเตอร์ได้ไหมครับ"},en:"Can you use the meter?",tip:"Ask in Bangkok taxis — metered is almost always cheaper!"},
    {f:{th:"Yoot tee nee ka",rom:"หยุดที่นี่ค่ะ",audio:"หยุดที่นี่ค่ะ"},m:{th:"Yoot tee nee krap",rom:"หยุดที่นี่ครับ",audio:"หยุดที่นี่ครับ"},en:"Stop here please",tip:"Critical for motorbike taxis and songthaews!"},
    {f:{th:"Trong pai ka",rom:"ตรงไปค่ะ",audio:"ตรงไปค่ะ"},m:{th:"Trong pai krap",rom:"ตรงไปครับ",audio:"ตรงไปครับ"},en:"Go straight",tip:"For directing any driver"},
    {f:{th:"Leo sai ka",rom:"เลี้ยวซ้ายค่ะ",audio:"เลี้ยวซ้ายค่ะ"},m:{th:"Leo sai krap",rom:"เลี้ยวซ้ายครับ",audio:"เลี้ยวซ้ายครับ"},en:"Turn left please",tip:"Sai = left. Leo = turn"},
    {f:{th:"Leo khwa ka",rom:"เลี้ยวขวาค่ะ",audio:"เลี้ยวขวาค่ะ"},m:{th:"Leo khwa krap",rom:"เลี้ยวขวาครับ",audio:"เลี้ยวขวาครับ"},en:"Turn right please",tip:"Khwa = right!"},
    {f:{th:"Yoot trong nan ka",rom:"หยุดตรงนั้นค่ะ",audio:"หยุดตรงนั้นค่ะ"},m:{th:"Yoot trong nan krap",rom:"หยุดตรงนั้นครับ",audio:"หยุดตรงนั้นครับ"},en:"Stop over there please",tip:"Point while saying — very clear for drivers"},
   ]},
   { id:"t2",title:"Places Around Town",cards:[
    {f:{th:"Talaat",rom:"ตลาด",audio:"ตลาด"},m:{th:"Talaat",rom:"ตลาด",audio:"ตลาด"},en:"Market",tip:"Talaat rot fai = train market, Talaat nam = floating market"},
    {f:{th:"Sanam bin",rom:"สนามบิน",audio:"สนามบิน"},m:{th:"Sanam bin",rom:"สนามบิน",audio:"สนามบิน"},en:"Airport",tip:"Literally 'flying field' — sanam=field, bin=fly"},
    {f:{th:"Rohng phayaban",rom:"โรงพยาบาล",audio:"โรงพยาบาล"},m:{th:"Rohng phayaban",rom:"โรงพยาบาล",audio:"โรงพยาบาล"},en:"Hospital",tip:"Private hospitals in Thailand are excellent and affordable"},
    {f:{th:"Raan khai ya",rom:"ร้านขายยา",audio:"ร้านขายยา"},m:{th:"Raan khai ya",rom:"ร้านขายยา",audio:"ร้านขายยา"},en:"Pharmacy",tip:"Look for the green cross sign. Very helpful!"},
    {f:{th:"Haad",rom:"หาด",audio:"หาด"},m:{th:"Haad",rom:"หาด",audio:"หาด"},en:"Beach",tip:"You'll see 'haad' in many beach names — Haad Rin, Haad Chaweng"},
    {f:{th:"Rohng raem",rom:"โรงแรม",audio:"โรงแรม"},m:{th:"Rohng raem",rom:"โรงแรม",audio:"โรงแรม"},en:"Hotel",tip:"Rohng = building/institution (rohng rian = school)"},
    {f:{th:"Sathani tamruat",rom:"สถานีตำรวจ",audio:"สถานีตำรวจ"},m:{th:"Sathani tamruat",rom:"สถานีตำรวจ",audio:"สถานีตำรวจ"},en:"Police station",tip:"Tourist police: dial 1155 for English-speaking help"},
    {f:{th:"Hong nam yuu tee nai kha?",rom:"ห้องน้ำอยู่ที่ไหนคะ",audio:"ห้องน้ำอยู่ที่ไหนคะ"},m:{th:"Hong nam yuu tee nai krap?",rom:"ห้องน้ำอยู่ที่ไหนครับ",audio:"ห้องน้ำอยู่ที่ไหนครับ"},en:"Where is the toilet?",tip:"Hong nam = toilet/bathroom. One of the most essential phrases!"},
    {f:{th:"Mee hong nam mai kha?",rom:"มีห้องน้ำไหมคะ",audio:"มีห้องน้ำไหมคะ"},m:{th:"Mee hong nam mai krap?",rom:"มีห้องน้ำไหมครับ",audio:"มีห้องน้ำไหมครับ"},en:"Is there a toilet here?",tip:"Useful when you're not sure — markets, temples, beaches"},
   ]},
  ]
 },
 {
  id:"daily",title:"Daily Life",emoji:"🏠",color:"#C3A6FF",
  lessons:[
   { id:"d1",title:"Renting & Home",cards:[
    {f:{th:"Chan yak chao condo ka",rom:"ฉันอยากเช่าคอนโดค่ะ",audio:"ฉันอยากเช่าคอนโดค่ะ"},m:{th:"Phom yak chao condo krap",rom:"ผมอยากเช่าคอนโดครับ",audio:"ผมอยากเช่าคอนโดครับ"},en:"I'd like to rent a condo",tip:"Women say 'Chan', men say 'Phom' for 'I'"},
    {f:{th:"Kha chao tao rai kha?",rom:"ค่าเช่าเท่าไหร่คะ",audio:"ค่าเช่าเท่าไหร่คะ"},m:{th:"Kha chao tao rai krap?",rom:"ค่าเช่าเท่าไหร่ครับ",audio:"ค่าเช่าเท่าไหร่ครับ"},en:"How much is the rent?",tip:"Kha chao = rental cost"},
    {f:{th:"Ruam fai fa lae nam mai kha?",rom:"รวมไฟฟ้าและน้ำไหมคะ",audio:"รวมไฟฟ้าและน้ำไหมคะ"},m:{th:"Ruam fai fa lae nam mai krap?",rom:"รวมไฟฟ้าและน้ำไหมครับ",audio:"รวมไฟฟ้าและน้ำไหมครับ"},en:"Does it include electricity and water?",tip:"Very important — bills are often separate in Thailand!"},
    {f:{th:"Mee Wi-Fi mai kha?",rom:"มีไวไฟไหมคะ",audio:"มีไวไฟไหมคะ"},m:{th:"Mee Wi-Fi mai krap?",rom:"มีไวไฟไหมครับ",audio:"มีไวไฟไหมครับ"},en:"Is there Wi-Fi?",tip:"Thai Wi-Fi = 'wai-fai' — borrowed and Thai-ified!"},
    {f:{th:"Kho duu hong noi dai mai kha?",rom:"ขอดูห้องหน่อยได้ไหมคะ",audio:"ขอดูห้องหน่อยได้ไหมคะ"},m:{th:"Kho duu hong noi dai mai krap?",rom:"ขอดูห้องหน่อยได้ไหมครับ",audio:"ขอดูห้องหน่อยได้ไหมครับ"},en:"May I see the room please?",tip:"Perfect phrase when viewing a rental property"},
    {f:{th:"Mi koon jae mai kha?",rom:"มีกุญแจไหมคะ",audio:"มีกุญแจไหมคะ"},m:{th:"Mi koon jae mai krap?",rom:"มีกุญแจไหมครับ",audio:"มีกุญแจไหมครับ"},en:"Is there a key?",tip:"Goon jae = key. Useful for guesthouses and rentals"},
   ]},
   { id:"d2",title:"Health & Emergencies",cards:[
    {f:{th:"Chuay duay ka!",rom:"ช่วยด้วยค่ะ",audio:"ช่วยด้วยค่ะ"},m:{th:"Chuay duay krap!",rom:"ช่วยด้วยครับ",audio:"ช่วยด้วยครับ"},en:"Help!",tip:"Shout clearly with your polite particle — it helps identify you"},
    {f:{th:"Chan jep tee nee",rom:"ฉันเจ็บที่นี่",audio:"ฉันเจ็บที่นี่"},m:{th:"Phom jep tee nee",rom:"ผมเจ็บที่นี่",audio:"ผมเจ็บที่นี่"},en:"It hurts here",tip:"Point to where it hurts while saying this"},
    {f:{th:"Chan mai sabai ka",rom:"ฉันไม่สบายค่ะ",audio:"ฉันไม่สบายค่ะ"},m:{th:"Phom mai sabai krap",rom:"ผมไม่สบายครับ",audio:"ผมไม่สบายครับ"},en:"I'm not feeling well",tip:"Simple and clear for pharmacists and doctors"},
    {f:{th:"Khor ya gae puad hua ka",rom:"ขอยาแก้ปวดหัวค่ะ",audio:"ขอยาแก้ปวดหัวค่ะ"},m:{th:"Khor ya gae puad hua krap",rom:"ขอยาแก้ปวดหัวครับ",audio:"ขอยาแก้ปวดหัวครับ"},en:"Headache medicine please",tip:"Gae=treat, Puad=pain, Hua=head"},
    {f:{th:"Chan phaae...",rom:"ฉันแพ้...",audio:"ฉันแพ้"},m:{th:"Phom phaae...",rom:"ผมแพ้...",audio:"ผมแพ้"},en:"I'm allergic to...",tip:"Phaae thua = allergic to peanuts. Important to know!"},
    {f:{th:"Chuay riak rot phayaban ka",rom:"ช่วยเรียกรถพยาบาลค่ะ",audio:"ช่วยเรียกรถพยาบาลค่ะ"},m:{th:"Chuay riak rot phayaban krap",rom:"ช่วยเรียกรถพยาบาลครับ",audio:"ช่วยเรียกรถพยาบาลครับ"},en:"Please call an ambulance",tip:"Thai emergency number is 1669"},
   ]},
   { id:"d3",title:"Making Friends",cards:[
    {f:{th:"Kun cheu arai kha?",rom:"คุณชื่ออะไรคะ",audio:"คุณชื่ออะไรคะ"},m:{th:"Kun cheu arai krap?",rom:"คุณชื่ออะไรครับ",audio:"คุณชื่ออะไรครับ"},en:"What's your name?",tip:"Kun = you (polite). Don't use with monks or elders you don't know"},
    {f:{th:"Chan cheu...",rom:"ฉันชื่อ...",audio:"ฉันชื่อ"},m:{th:"Phom cheu...",rom:"ผมชื่อ...",audio:"ผมชื่อ"},en:"My name is...",tip:"Women say 'Chan cheu', men say 'Phom cheu'"},
    {f:{th:"Chan maa jak...",rom:"ฉันมาจาก...",audio:"ฉันมาจาก"},m:{th:"Phom maa jak...",rom:"ผมมาจาก...",audio:"ผมมาจาก"},en:"I'm from...",tip:"Thais are always curious where foreigners are from!"},
    {f:{th:"Chan phuut Thai dai nit noi ka",rom:"ฉันพูดไทยได้นิดหน่อยค่ะ",audio:"ฉันพูดไทยได้นิดหน่อยค่ะ"},m:{th:"Phom phuut Thai dai nit noi krap",rom:"ผมพูดไทยได้นิดหน่อยครับ",audio:"ผมพูดไทยได้นิดหน่อยครับ"},en:"I speak a little Thai",tip:"Thais absolutely love hearing this — expect big smiles!"},
    {f:{th:"Phuut cha cha noi dai mai kha?",rom:"พูดช้าๆหน่อยได้ไหมคะ",audio:"พูดช้าๆหน่อยได้ไหมคะ"},m:{th:"Phuut cha cha noi dai mai krap?",rom:"พูดช้าๆหน่อยได้ไหมครับ",audio:"พูดช้าๆหน่อยได้ไหมครับ"},en:"Can you speak slowly please?",tip:"Very useful — and Thais will happily slow down for you"},
    {f:{th:"Chan mai khao jai ka",rom:"ฉันไม่เข้าใจค่ะ",audio:"ฉันไม่เข้าใจค่ะ"},m:{th:"Phom mai khao jai krap",rom:"ผมไม่เข้าใจครับ",audio:"ผมไม่เข้าใจครับ"},en:"I don't understand",tip:"Honest and helpful. Thais won't judge — they appreciate the effort!"},
    {f:{th:"Gin khao yang kha?",rom:"กินข้าวยังคะ",audio:"กินข้าวยังคะ"},m:{th:"Gin khao yang krap?",rom:"กินข้าวยังครับ",audio:"กินข้าวยังครับ"},en:"Have you eaten yet?",tip:"THE most common Thai friend greeting — it's how Thais show they care!"},
   ]},
  ]
 },
 {
  id:"culture",title:"Culture & Customs",emoji:"🏯",color:"#FF8FAB",
  lessons:[
   { id:"c1",title:"Thai Values & Life",cards:[
    {f:{th:"Wai",rom:"ไหว้",audio:"ไหว้"},m:{th:"Wai",rom:"ไหว้",audio:"ไหว้"},en:"Respectful bow greeting",tip:"Hands at chest, slight bow. Wai back to those who wai you. Don't wai children"},
    {f:{th:"Sanuk",rom:"สนุก",audio:"สนุก"},m:{th:"Sanuk",rom:"สนุก",audio:"สนุก"},en:"Fun / Enjoyable",tip:"Thais value sanuk above almost all else — everything should be fun!"},
    {f:{th:"Jai yen yen",rom:"ใจเย็นๆ",audio:"ใจเย็นๆ"},m:{th:"Jai yen yen",rom:"ใจเย็นๆ",audio:"ใจเย็นๆ"},en:"Keep calm / Cool heart",tip:"Literally 'cool heart' — the Thai way. Never show anger in public"},
    {f:{th:"Kreng jai",rom:"เกรงใจ",audio:"เกรงใจ"},m:{th:"Kreng jai",rom:"เกรงใจ",audio:"เกรงใจ"},en:"Consideration for others",tip:"Being careful not to burden or impose on others — a core Thai value"},
    {f:{th:"Farang suay",rom:"ฝรั่งสวย",audio:"ฝรั่งสวย"},m:{th:"Farang lor",rom:"ฝรั่งหล่อ",audio:"ฝรั่งหล่อ"},en:"Attractive foreigner",tip:"Women hear 'suay' (pretty), men hear 'lor' (handsome) — Thais are very complimentary!"},
    {f:{th:"Bai nai ma kha?",rom:"ไปไหนมาคะ",audio:"ไปไหนมาคะ"},m:{th:"Bai nai ma krap?",rom:"ไปไหนมาครับ",audio:"ไปไหนมาครับ"},en:"Where have you been?",tip:"Casual greeting between friends — not as intrusive as it sounds!"},
   ]},
   { id:"c2",title:"At the Temple",cards:[
    {f:{th:"Wat",rom:"วัด",audio:"วัด"},m:{th:"Wat",rom:"วัด",audio:"วัด"},en:"Temple",tip:"Remove shoes! Women cover shoulders and knees; men must also dress modestly"},
    {f:{th:"Phra",rom:"พระ",audio:"พระ"},m:{th:"Phra",rom:"พระ",audio:"พระ"},en:"Monk / Sacred",tip:"Women must never touch monks. Men can hand things directly to monks"},
    {f:{th:"Tam boon",rom:"ทำบุญ",audio:"ทำบุญ"},m:{th:"Tam boon",rom:"ทำบุญ",audio:"ทำบุญ"},en:"Make merit",tip:"Donating to temples or giving food to monks = making good karma"},
    {f:{th:"San phra phum",rom:"ศาลพระภูมิ",audio:"ศาลพระภูมิ"},m:{th:"San phra phum",rom:"ศาลพระภูมิ",audio:"ศาลพระภูมิ"},en:"Spirit house",tip:"The small shrines outside every building. Always pass respectfully"},
    {f:{th:"Kho hai choke dee ka",rom:"ขอให้โชคดีค่ะ",audio:"ขอให้โชคดีค่ะ"},m:{th:"Kho hai choke dee krap",rom:"ขอให้โชคดีครับ",audio:"ขอให้โชคดีครับ"},en:"Wishing you good fortune",tip:"Said at temples when making wishes or offerings"},
   ]},
  ]
 },
 {
  id:"advanced",title:"Intermediate Thai",emoji:"⚡",color:"#FFA552",
  lessons:[
   { id:"a1",title:"Expressing Yourself",cards:[
    {f:{th:"Chan yak pai...",rom:"ฉันอยากไป...",audio:"ฉันอยากไป"},m:{th:"Phom yak pai...",rom:"ผมอยากไป...",audio:"ผมอยากไป"},en:"I want to go to...",tip:"Women: 'Chan yak', Men: 'Phom yak' — the rest of the sentence is the same!"},
    {f:{th:"Chan chorp...",rom:"ฉันชอบ...",audio:"ฉันชอบ"},m:{th:"Phom chorp...",rom:"ผมชอบ...",audio:"ผมชอบ"},en:"I like...",tip:"Chan/Phom chorp gin pad thai = I like eating pad thai"},
    {f:{th:"Chan mai chorp...",rom:"ฉันไม่ชอบ...",audio:"ฉันไม่ชอบ"},m:{th:"Phom mai chorp...",rom:"ผมไม่ชอบ...",audio:"ผมไม่ชอบ"},en:"I don't like...",tip:"Just add 'mai' to negate. Super useful!"},
    {f:{th:"Dai mai kha?",rom:"ได้ไหมคะ",audio:"ได้ไหมคะ"},m:{th:"Dai mai krap?",rom:"ได้ไหมครับ",audio:"ได้ไหมครับ"},en:"Is that possible? / Can I?",tip:"Add to the end of almost any request to make it polite"},
    {f:{th:"Dai ka / Mai dai ka",rom:"ได้ค่ะ / ไม่ได้ค่ะ",audio:"ได้ค่ะ"},m:{th:"Dai krap / Mai dai krap",rom:"ได้ครับ / ไม่ได้ครับ",audio:"ได้ครับ"},en:"Yes I can / No I can't",tip:"Dai = yes/can. Mai dai = cannot/no. Super versatile!"},
    {f:{th:"Mee / Mai mee",rom:"มี / ไม่มี",audio:"มี"},m:{th:"Mee / Mai mee",rom:"มี / ไม่มี",audio:"มี"},en:"Have it / Don't have it",tip:"Mee hong wang mai? = Is there a vacant room?"},
    {f:{th:"Pai duay gan mai kha?",rom:"ไปด้วยกันไหมคะ",audio:"ไปด้วยกันไหมคะ"},m:{th:"Pai duay gan mai krap?",rom:"ไปด้วยกันไหมครับ",audio:"ไปด้วยกันไหมครับ"},en:"Shall we go together?",tip:"Great for making plans with friends!"},
   ]},
   { id:"a2",title:"Time & Planning",cards:[
    {f:{th:"Wan nee",rom:"วันนี้",audio:"วันนี้"},m:{th:"Wan nee",rom:"วันนี้",audio:"วันนี้"},en:"Today",tip:"Wan = day, Nee = this"},
    {f:{th:"Proong nee",rom:"พรุ่งนี้",audio:"พรุ่งนี้"},m:{th:"Proong nee",rom:"พรุ่งนี้",audio:"พรุ่งนี้"},en:"Tomorrow",tip:"Very useful for planning trips or meetups"},
    {f:{th:"Meua wan nee",rom:"เมื่อวานนี้",audio:"เมื่อวานนี้"},m:{th:"Meua wan nee",rom:"เมื่อวานนี้",audio:"เมื่อวานนี้"},en:"Yesterday",tip:"Meua = a past time marker"},
    {f:{th:"Diao nee",rom:"เดี๋ยวนี้",audio:"เดี๋ยวนี้"},m:{th:"Diao nee",rom:"เดี๋ยวนี้",audio:"เดี๋ยวนี้"},en:"Right now",tip:"'Diao' alone can mean 'in a moment' — context is key!"},
    {f:{th:"Gee mohng laew kha?",rom:"กี่โมงแล้วคะ",audio:"กี่โมงแล้วคะ"},m:{th:"Gee mohng laew krap?",rom:"กี่โมงแล้วครับ",audio:"กี่โมงแล้วครับ"},en:"What time is it?",tip:"Mohng = hour/o'clock. Gee = how many"},
    {f:{th:"Chan ja pai...",rom:"ฉันจะไป...",audio:"ฉันจะไป"},m:{th:"Phom ja pai...",rom:"ผมจะไป...",audio:"ผมจะไป"},en:"I will go to...",tip:"'Ja' marks future tense — place it before the verb"},
    {f:{th:"Reo reo na ka",rom:"เร็วๆนะคะ",audio:"เร็วๆนะคะ"},m:{th:"Reo reo na krap",rom:"เร็วๆนะครับ",audio:"เร็วๆนะครับ"},en:"Quickly please!",tip:"Add 'na' to soften — otherwise it sounds demanding"},
   ]},
  ]
 },
 {
  id:"adjectives",title:"Adjectives",emoji:"🌈",color:"#26C6DA",
  lessons:[
   { id:"adj1",title:"Good, Bad & Feelings",cards:[
    {f:{th:"Dee",rom:"ดี",audio:"ดี"},m:{th:"Dee",rom:"ดี",audio:"ดี"},en:"Good",opposite:"Mai dee",oppTh:"ไม่ดี",tip:"Dee = good. Add 'mai' before any adjective to flip it negative!"},
    {f:{th:"Mai dee",rom:"ไม่ดี",audio:"ไม่ดี"},m:{th:"Mai dee",rom:"ไม่ดี",audio:"ไม่ดี"},en:"Bad",opposite:"Dee",oppTh:"ดี",tip:"Mai dee = not good. 'Mai' is Thai's all-purpose negation word"},
    {f:{th:"Sanuk",rom:"สนุก",audio:"สนุก"},m:{th:"Sanuk",rom:"สนุก",audio:"สนุก"},en:"Fun",opposite:"Naa buea",oppTh:"น่าเบื่อ",tip:"Sanuk = fun — one of the most important Thai values!"},
    {f:{th:"Naa buea",rom:"น่าเบื่อ",audio:"น่าเบื่อ"},m:{th:"Naa buea",rom:"น่าเบื่อ",audio:"น่าเบื่อ"},en:"Boring",opposite:"Sanuk",oppTh:"สนุก",tip:"Naa buea = boring/tedious. Thais avoid things that are naa buea!"},
    {f:{th:"Suay",rom:"สวย",audio:"สวย"},m:{th:"Lor",rom:"หล่อ",audio:"หล่อ"},en:"Beautiful / Handsome",opposite:"Naa gliat",oppTh:"น่าเกลียด",tip:"Women: suay (pretty), men: lor (handsome). Both are compliments!"},
    {f:{th:"Naa gliat",rom:"น่าเกลียด",audio:"น่าเกลียด"},m:{th:"Naa gliat",rom:"น่าเกลียด",audio:"น่าเกลียด"},en:"Ugly",opposite:"Suay / Lor",oppTh:"สวย / หล่อ",tip:"Naa gliat = ugly. Opposite of suay (f) or lor (m)"},
    {f:{th:"Dee jai",rom:"ดีใจ",audio:"ดีใจ"},m:{th:"Dee jai",rom:"ดีใจ",audio:"ดีใจ"},en:"Happy",opposite:"Sia jai",oppTh:"เสียใจ",tip:"Dee jai = good heart. Jai means heart — Thai emotions are heart-based!"},
    {f:{th:"Sia jai",rom:"เสียใจ",audio:"เสียใจ"},m:{th:"Sia jai",rom:"เสียใจ",audio:"เสียใจ"},en:"Sad",opposite:"Dee jai",oppTh:"ดีใจ",tip:"Sia jai = lost heart. So poetic — it literally means your heart is gone"},
    {f:{th:"Woon wai",rom:"วุ่นวาย",audio:"วุ่นวาย"},m:{th:"Woon wai",rom:"วุ่นวาย",audio:"วุ่นวาย"},en:"Busy / Chaotic",opposite:"Sabai",oppTh:"สบาย",tip:"Woon wai = hectic/chaotic. The opposite feeling is sabai — relaxed and comfortable"},
    {f:{th:"Mao",rom:"เมา",audio:"เมา"},m:{th:"Mao",rom:"เมา",audio:"เมา"},en:"Drunk",opposite:"Mai mao",oppTh:"ไม่เมา",tip:"Mao = drunk. Very useful phrase in Thailand! Mai mao = not drunk"},
   ]},
   { id:"adj2",title:"Size & Amount",cards:[
    {f:{th:"Yai",rom:"ใหญ่",audio:"ใหญ่"},m:{th:"Yai",rom:"ใหญ่",audio:"ใหญ่"},en:"Big",opposite:"Lek",oppTh:"เล็ก",tip:"Yai = big/large. You'll hear this everywhere — rooms, portions, sizes!"},
    {f:{th:"Lek",rom:"เล็ก",audio:"เล็ก"},m:{th:"Lek",rom:"เล็ก",audio:"เล็ก"},en:"Small",opposite:"Yai",oppTh:"ใหญ่",tip:"Lek = small. Also a very common Thai nickname for short people!"},
    {f:{th:"Soong",rom:"สูง",audio:"สูง"},m:{th:"Soong",rom:"สูง",audio:"สูง"},en:"Tall / High",opposite:"Tia",oppTh:"เตี้ย",tip:"Soong = tall or high. Used for people, buildings, and prices!"},
    {f:{th:"Tia",rom:"เตี้ย",audio:"เตี้ย"},m:{th:"Tia",rom:"เตี้ย",audio:"เตี้ย"},en:"Short",opposite:"Soong",oppTh:"สูง",tip:"Tia = short (height). Thais use this very casually — not considered rude!"},
    {f:{th:"Gwang",rom:"กว้าง",audio:"กว้าง"},m:{th:"Gwang",rom:"กว้าง",audio:"กว้าง"},en:"Wide",opposite:"Kaep",oppTh:"แคบ",tip:"Gwang = wide/broad. Great for describing roads, rooms, spaces"},
    {f:{th:"Kaep",rom:"แคบ",audio:"แคบ"},m:{th:"Kaep",rom:"แคบ",audio:"แคบ"},en:"Narrow",opposite:"Gwang",oppTh:"กว้าง",tip:"Kaep = narrow. You'll use this describing Bangkok sois (side streets)!"},
    {f:{th:"Nak",rom:"หนัก",audio:"หนัก"},m:{th:"Nak",rom:"หนัก",audio:"หนัก"},en:"Heavy",opposite:"Bao",oppTh:"เบา",tip:"Nak = heavy. Also means serious or intense — nak mak = very heavy"},
    {f:{th:"Bao",rom:"เบา",audio:"เบา"},m:{th:"Bao",rom:"เบา",audio:"เบา"},en:"Light",opposite:"Nak",oppTh:"หนัก",tip:"Bao = light (weight). Also means mild — phet bao = mildly spicy"},
    {f:{th:"Naa",rom:"หนา",audio:"หนา"},m:{th:"Naa",rom:"หนา",audio:"หนา"},en:"Thick",opposite:"Baang",oppTh:"บาง",tip:"Naa = thick. Used for fabric, books, layers of anything"},
    {f:{th:"Baang",rom:"บาง",audio:"บาง"},m:{th:"Baang",rom:"บาง",audio:"บาง"},en:"Thin",opposite:"Naa",oppTh:"หนา",tip:"Baang = thin. Bangkok = Krung Thep but old name has Baang in it!"},
    {f:{th:"Mak",rom:"มาก",audio:"มาก"},m:{th:"Mak",rom:"มาก",audio:"มาก"},en:"A lot / Very",opposite:"Noi",oppTh:"น้อย",tip:"Mak = a lot — put it at the END: aroi mak = very delicious!"},
    {f:{th:"Noi",rom:"น้อย",audio:"น้อย"},m:{th:"Noi",rom:"น้อย",audio:"น้อย"},en:"A little",opposite:"Mak",oppTh:"มาก",tip:"Noi = a little. Noi noi = very little — great for managing spice levels!"},
   ]},
   { id:"adj3",title:"Price & Difficulty",cards:[
    {f:{th:"Paeng",rom:"แพง",audio:"แพง"},m:{th:"Paeng",rom:"แพง",audio:"แพง"},en:"Expensive",opposite:"Thook",oppTh:"ถูก",tip:"Paeng = expensive. Say with a pained expression when bargaining!"},
    {f:{th:"Thook",rom:"ถูก",audio:"ถูก"},m:{th:"Thook",rom:"ถูก",audio:"ถูก"},en:"Cheap",opposite:"Paeng",oppTh:"แพง",tip:"Thook = cheap. Thook mak! = so cheap! Great to say when happy with a price"},
    {f:{th:"Ngai",rom:"ง่าย",audio:"ง่าย"},m:{th:"Ngai",rom:"ง่าย",audio:"ง่าย"},en:"Easy",opposite:"Yaak",oppTh:"ยาก",tip:"Ngai = easy. Starts with that tricky ng sound — practice it!"},
    {f:{th:"Yaak",rom:"ยาก",audio:"ยาก"},m:{th:"Yaak",rom:"ยาก",audio:"ยาก"},en:"Difficult",opposite:"Ngai",oppTh:"ง่าย",tip:"Yaak = hard/difficult. Also means 'want to' — context tells them apart!"},
    {f:{th:"Geng",rom:"เก่ง",audio:"เก่ง"},m:{th:"Geng",rom:"เก่ง",audio:"เก่ง"},en:"Skilled / Talented",opposite:"Mai geng",oppTh:"ไม่เก่ง",tip:"Geng = talented/skilled. Thais will say 'geng mak!' when impressed by your Thai!"},
    {f:{th:"Mai geng",rom:"ไม่เก่ง",audio:"ไม่เก่ง"},m:{th:"Mai geng",rom:"ไม่เก่ง",audio:"ไม่เก่ง"},en:"Not skilled",opposite:"Geng",oppTh:"เก่ง",tip:"Mai geng = not good at something. A humble thing to say about yourself!"},
   ]},
   { id:"adj4",title:"Temperature & Condition",cards:[
    {f:{th:"Rorn",rom:"ร้อน",audio:"ร้อน"},m:{th:"Rorn",rom:"ร้อน",audio:"ร้อน"},en:"Hot",opposite:"Yen",oppTh:"เย็น",tip:"Rorn = hot. Used for weather, food and drinks — very versatile!"},
    {f:{th:"Yen",rom:"เย็น",audio:"เย็น"},m:{th:"Yen",rom:"เย็น",audio:"เย็น"},en:"Cold / Cool",opposite:"Rorn",oppTh:"ร้อน",tip:"Yen = cold or cool. Kafae yen = iced coffee. Nam yen = cold water"},
    {f:{th:"Un",rom:"อุ่น",audio:"อุ่น"},m:{th:"Un",rom:"อุ่น",audio:"อุ่น"},en:"Warm",opposite:"Naao",oppTh:"หนาว",tip:"Un = warm and cosy. Also used emotionally — jai un = warm-hearted"},
    {f:{th:"Naao",rom:"หนาว",audio:"หนาว"},m:{th:"Naao",rom:"หนาว",audio:"หนาว"},en:"Cold (weather)",opposite:"Un",oppTh:"อุ่น",tip:"Naao = chilly weather. Thais say naao when it drops to 25°C!"},

function speak(text, gender){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const g=gender||state.gender||'f';
  const cfg=LANG[g].voice;
  const u=new SpeechSynthesisUtterance(text);
  u.lang="th-TH"; u.rate=cfg.rate; u.pitch=cfg.pitch;
  const v=window.speechSynthesis.getVoices().find(v=>v.lang==="th-TH"||v.lang==="th");
  if(v) u.voice=v;
  window.speechSynthesis.speak(u);
}

  S.set('thaif_s',u); return u;
}

//  QUIZ GENERATOR
// ═══════════════════════════════════════
function generateQuiz(cards,maxQ=7){
  const hasOpposites=cards.some(c=>c.opposite);
  const shuffled=[...cards].sort(()=>Math.random()-.5);
  const q=shuffled.slice(0,Math.min(maxQ,shuffled.length));
  return q.map((card,i)=>{
    // For adjective cards (have opposite field), rotate 3 question types
    let type;
    if(hasOpposites && card.opposite){
      const roll=i%3;
      type=roll===0?'th-to-en':roll===1?'en-to-th':'opposite';
    } else {
      type=i%2===0?'th-to-en':'en-to-th';
    }
    const others=cards.filter(c=>c.en!==card.en).sort(()=>Math.random()-.5).slice(0,3);
    const options=[...others,card].sort(()=>Math.random()-.5);
    return{card,type,options};
  });
}

function speakBtn(text,color,size=38,text2=null){
  const id='sb_'+Math.random().toString(36).slice(2);
  setTimeout(()=>{
    const el=document.getElementById(id);
    if(el) el.onclick=(e)=>{
      e.stopPropagation();
      el.style.background=color; el.textContent='🔊'; speak(text);
      if(text2){
        // play second word after a pause
        const cfg=LANG[state.gender||'f'].voice;
        const pauseMs = Math.round((text.length * 120) / cfg.rate) + 600;
        setTimeout(()=>speak(text2), pauseMs);
        setTimeout(()=>{el.style.background=color+'28'; el.textContent='🔈';}, pauseMs+1800);
      } else {
        setTimeout(()=>{el.style.background=color+'28'; el.textContent='🔈';},1800);
      }
    };
  },0);
  return `<button id="${id}" style="width:${size}px;height:${size}px;border-radius:50%;background:${color}28;border:2px solid ${color};display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.44)}px;transition:all .2s;flex-shrink:0">${text2?'🔈🔈':'🔈'}</button>`;
}

function quizHTML(){
  const {quiz,quizIndex,hearts,selectedAnswer,answered,unit}=state;
  const q=quiz[quizIndex];
  const isOpp=q.type==='opposite';
  const isTh=q.type==='th-to-en';
  const gc=cardG(q.card);
  const pct=(quizIndex/quiz.length)*100;
  const heartsHTML=[1,2,3].map(i=>`<span style="font-size:18px;opacity:${hearts>=i?1:.15}">❤️</span>`).join('');

  const isCorrectCard=(opt)=>{
    if(isOpp) return opt.en===q.card.opposite || cardG(opt).th===q.card.oppTh;
    return opt.en===q.card.en;
  };
  const isSelectedCard=(opt)=>selectedAnswer?opt.en===selectedAnswer.en:false;
  const mangoMood=answered?(selectedAnswer&&isCorrectCard(selectedAnswer)?'celebrate':'cry'):hearts===1?'scared':'idle';

  const options=q.options.map((opt,i)=>{
    const optGc=cardG(opt);
    const isCorrect=isCorrectCard(opt);
    const isSel=isSelectedCard(opt);
    let bg='#1c1c28',border='#ffffff15',col='#f0ece4';
    if(answered){
      if(isCorrect){bg='#22c55e20';border='#22c55e';col='#22c55e';}
      else if(isSel){bg='#ef444420';border='#ef4444';col='#ef4444';}
    } else if(isSel){bg=unit.color+'20';border=unit.color;}
    const anim=answered&&isSel?(isCorrect?'pop':'shake'):'';
    const label=isOpp?opt.en:(isTh?opt.en:optGc.th+'  ('+optGc.rom+')');
    return '<button class="btn-press '+anim+'" data-opt="'+i+'" style="width:100%;background:'+bg+';border:2px solid '+border+';border-radius:14px;padding:15px 16px;text-align:left;color:'+col+';font-weight:700;font-size:14px;transition:all .2s;display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="flex:1">'+label+'</span>'+(answered&&isCorrect?'<span style="font-size:18px">✓</span>':'')+(answered&&isSel&&!isCorrect?'<span style="font-size:18px">✗</span>':'')+'</button>';
  }).join('');

  let instruction,questionWord,questionSub;
  if(isOpp){
    instruction='⟷ What is the OPPOSITE of...?';
    questionWord=gc.th;
    questionSub=gc.rom+' = '+q.card.en;
  } else if(isTh){
    instruction='What does this mean in English?';
    questionWord=gc.th;
    questionSub=gc.rom;
  } else {
    instruction='How do you say this in Thai?';
    questionWord=q.card.en;
    questionSub=null;
  }

  return '<div style="min-height:600px;display:flex;flex-direction:column">'
    +'<div style="padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff10">'
    +'<button id="quitQuiz" class="btn-press" style="background:#ffffff15;border-radius:10px;padding:7px 12px;font-size:13px;color:#fff;font-weight:700">✕</button>'
    +'<div style="flex:1;height:8px;background:#ffffff10;border-radius:99px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+unit.color+';border-radius:99px;transition:width .3s"></div></div>'
    +'<div style="display:flex;gap:3px">'+heartsHTML+'</div>'
    +'</div>'
    +'<div style="padding:6px 20px 0;display:flex;align-items:center;justify-content:space-between">'
    +'<div style="font-size:11px;color:#ffffff40;font-weight:700">'+(quizIndex+1)+' / '+quiz.length+'</div>'
    +'<div style="display:flex;align-items:center;gap:6px">'+mangoHTML(mangoMood,state.xp,32,state.gender)
    +'<div style="font-size:11px;color:#ffffff40;font-weight:700">'+(answered?(selectedAnswer&&isCorrectCard(selectedAnswer)?'✨ Great!':'💪 Keep going!'):'🤔 Choose...')+'</div>'
    +'</div>'
    +'</div>'
    +'<div style="flex:1;padding:12px 16px 20px">'
    +'<div style="margin-bottom:18px;text-align:center">'
    +'<div style="font-size:11px;color:'+(isOpp?'#FFE66D':'#ffffff40')+';font-weight:800;margin-bottom:10px;letter-spacing:1.2px;text-transform:uppercase'+(isOpp?';background:#FFE66D18;border-radius:8px;padding:4px 10px;display:inline-block':'')+'">'+(instruction)+'</div>'
    +'<div style="background:#1c1c28;border:2px solid '+unit.color+'40;border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px">'
    +'<div style="font-size:26px;font-weight:900;color:'+unit.color+';text-align:center;line-height:1.3">'+questionWord+'</div>'
    +(questionSub?'<div style="font-size:13px;color:#ffffff50;font-style:italic">'+questionSub+'</div>':'')
    +speakBtn(gc.audio||gc.th,unit.color,38)
    +'</div>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'+options+'</div>'
    +'</div>'
    +'</div>';
}

function miniCoinPop(){
  const c=document.createElement('div');
  c.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden';
  document.body.appendChild(c);
  ['🪙','⭐','✨','💛'].forEach((em,i)=>{
    const el=document.createElement('div');
    el.className='coin-pop'; el.textContent=em;
    const sz=18+Math.random()*14,x=30+Math.random()*40,dur=0.55+Math.random()*.35;
    el.style.cssText=`position:absolute;font-size:${sz}px;left:${x}%;top:50%;animation-duration:${dur}s;animation-delay:${i*.05}s`;
    c.appendChild(el);
  });
  setTimeout(()=>c.remove(),1400);
}
function launchCoins(){
  const layer=document.getElementById('coin-layer');
  if(!layer) return;
  const emojis=['🪙','🪙','🪙','💰','⭐','🪙','💛','🪙','✨','🪙','💫','🪙'];
  ['🪙','🪙','💰','⭐','✨','💛','🪙','💫'].forEach((em,i)=>{
    const el=document.createElement('div');
    el.className='coin-pop'; el.textContent=em;
    el.style.cssText=`position:absolute;font-size:${24+Math.random()*18}px;left:${30+Math.random()*40}%;top:${25+Math.random()*20}%;animation-duration:${.7+Math.random()*.5}s;animation-delay:${i*.06}s`;
    layer.appendChild(el);
  });
  for(let i=0;i<42;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='coin'; el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      const sz=18+Math.random()*22,dur=1.3+Math.random()*2.2;
      el.style.cssText=`font-size:${sz}px;left:${Math.random()*100}%;animation-duration:${dur}s`;
      layer.appendChild(el);
      setTimeout(()=>el.remove(),dur*1000+100);
    },i*70);
  }
  setTimeout(()=>{layer.querySelectorAll('.coin-pop').forEach(e=>e.remove());},3000);
}

let autoSpeakTimer=null;
function render(){
  const app=document.getElementById('app');
  let html='';
  if(state.screen==='home')   html=homeHTML();
  if(state.screen==='unit')   html=unitHTML();
  if(state.screen==='lesson') html=lessonHTML();
  if(state.screen==='tones') html=tonesLessonHTML();
  if(state.screen==='quiz')   html=quizHTML();
  if(state.screen==='result') html=resultHTML();
  app.innerHTML=`<div class="screen fade">${html}</div>`;
  bindEvents();
  if(state.screen==='lesson'&&!state.flashFlipped){
    clearTimeout(autoSpeakTimer);
    const card=state.lesson.cards[state.flashIndex];
    const gc=cardG(card);
    autoSpeakTimer=setTimeout(()=>{
      speak(gc.audio||gc.th);
      if(card.audio2){
        const cfg=LANG[state.gender||'f'].voice;
        const pauseMs=Math.round(((gc.audio||gc.th).length*120)/cfg.rate)+600;
        setTimeout(()=>speak(card.audio2),pauseMs);
      }
    },500);
  }
  if(state.screen==='result'){
    const passed=state.quizScore/state.quiz.length>=0.6&&state.hearts>0;
    if(passed) setTimeout(launchCoins,150);
  }
}

// ═══════════════════════════════════════
function bindEvents(){
  // Gender toggle
  const gBtnF=document.getElementById('gBtn-f');
  const gBtnM=document.getElementById('gBtn-m');
  if(gBtnF) gBtnF.addEventListener('click',()=>{ setG('f'); setState({gender:'f'}); });
  if(gBtnM) gBtnM.addEventListener('click',()=>{ setG('m'); setState({gender:'m'}); });

  // HOME — units
  document.querySelectorAll('[data-unit]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const unit=ALL_UNITS.find(u=>u.id===btn.dataset.unit);
      setState({screen:'unit',unit});
    });
  });

  // UNIT — back + lessons
  const backHome=document.getElementById('backToHome');
  if(backHome) backHome.addEventListener('click',()=>setState({screen:'home'}));
  document.querySelectorAll('[data-lesson]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const lessonId=btn.dataset.lesson;
      const unit=state.unit;
      if(unit.isCombo){
        const lessonDef=unit.lessons.find(l=>l.id===lessonId);
        const allCards=getAllCardsFromUnitIds(lessonDef.unitIds);
        const quiz=generateQuiz(allCards,lessonDef.cardCount);
        setState({screen:'quiz',lesson:lessonDef,quiz,quizIndex:0,quizScore:0,selectedAnswer:null,answered:false,hearts:3,newOutfit:null});
      } else if(unit.isTones){
        const lesson=unit.lessons.find(l=>l.id===lessonId);
        setState({screen:'tones',lesson,flashIndex:0,newOutfit:null});
      } else {
        const lesson=unit.lessons.find(l=>l.id===lessonId);
        setState({screen:'lesson',lesson,flashIndex:0,flashFlipped:false,newOutfit:null});
      }
    });
  });

  // LESSON
  const backUnit=document.getElementById('backToUnit');
  if(backUnit) backUnit.addEventListener('click',()=>setState({screen:'unit'}));
  const flipCard=document.getElementById('flipCard');
  if(flipCard) flipCard.addEventListener('click',()=>setState({flashFlipped:!state.flashFlipped}));

  // TONES nav
  const prevTone=document.getElementById('prevTone');
  if(prevTone) prevTone.addEventListener('click',()=>setState({flashIndex:Math.max(0,state.flashIndex-1)}));
  const nextTone=document.getElementById('nextTone');
  if(nextTone) nextTone.addEventListener('click',()=>setState({flashIndex:state.flashIndex+1}));
  const doneTones=document.getElementById('doneTones');
  if(doneTones) doneTones.addEventListener('click',()=>{
    markDone(state.lesson.id);
    setState({screen:'unit'});
  });
  const prevCard=document.getElementById('prevCard');
  if(prevCard) prevCard.addEventListener('click',()=>setState({flashIndex:Math.max(0,state.flashIndex-1),flashFlipped:false}));
  const nextCard=document.getElementById('nextCard');
  if(nextCard) nextCard.addEventListener('click',()=>setState({flashIndex:state.flashIndex+1,flashFlipped:false}));
  function startQuiz(){
    const quiz=generateQuiz(state.lesson.cards);
    setState({screen:'quiz',quiz,quizIndex:0,quizScore:0,selectedAnswer:null,answered:false,hearts:3,newOutfit:null});
  }
  const goQuiz=document.getElementById('goQuiz');
  const skipQuiz=document.getElementById('skipQuiz');
  if(goQuiz) goQuiz.addEventListener('click',startQuiz);
  if(skipQuiz) skipQuiz.addEventListener('click',startQuiz);

  // QUIZ
  const quitQuiz=document.getElementById('quitQuiz');
  if(quitQuiz) quitQuiz.addEventListener('click',()=>setState({screen:(state.unit.isCombo||state.unit.isTones)?'unit':'lesson'}));
  document.querySelectorAll('[data-opt]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(state.answered) return;
      const i=parseInt(btn.dataset.opt);
      const opt=state.quiz[state.quizIndex].options[i];
      const qCard=state.quiz[state.quizIndex].card;
      const correct=state.quiz[state.quizIndex].type==='opposite'
        ? (opt.en===qCard.opposite || cardG(opt).th===qCard.oppTh)
        : opt.en===qCard.en;
      let ns=state.quizScore,nh=state.hearts;
      if(correct){
        ns++;addXP(10);
        const crd=state.quiz[state.quizIndex].card;
        const gcrd=cardG(crd);
        // For opposite questions, speak the correct opposite word
        if(state.quiz[state.quizIndex].type==='opposite' && crd.oppTh){
          speak(crd.oppTh);
        } else {
          speak(gcrd.audio||gcrd.th);
        }
        miniCoinPop();
      }
      else{nh--;}
      setState({selectedAnswer:opt,answered:true,quizScore:ns,hearts:nh});
      setTimeout(()=>{
        if(state.quizIndex+1>=state.quiz.length||nh<=0){
          if(ns/state.quiz.length>=0.6) markDone(state.lesson.id);
          setState({screen:'result'});
        } else {
          setState({quizIndex:state.quizIndex+1,selectedAnswer:null,answered:false});
        }
      },1100);
    });
  });

  // RESULT
  const goHome=document.getElementById('goHome');
  if(goHome) goHome.addEventListener('click',()=>setState({screen:'home',newOutfit:null}));
  const retryQuiz=document.getElementById('retryQuiz');
  if(retryQuiz) retryQuiz.addEventListener('click',()=>{
    let quiz;
    if(state.unit.isCombo){
      const allCards=getAllCardsFromUnitIds(state.lesson.unitIds);
      quiz=generateQuiz(allCards,state.lesson.cardCount);
    } else {
      quiz=generateQuiz(state.lesson.cards);
    }
    setState({screen:'quiz',quiz,quizIndex:0,quizScore:0,selectedAnswer:null,answered:false,hearts:3,newOutfit:null});
  });
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
render();
</script>
